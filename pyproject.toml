[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "device-deck"
version = "0.1.0"
description = "Local-first device inventory, connection profiles, read-only probes, Skills and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=2,<3", "pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
device-deck = "device_deck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/device_deck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# The project is installed non-editable (see README); rebuild it whenever package sources change
# so `uv run --no-editable` never executes a stale snapshot.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/static/*" }]
