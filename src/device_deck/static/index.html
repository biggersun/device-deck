<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeviceDeck</title><link rel="stylesheet" href="/assets/style.css"><script defer src="/assets/app.js"></script></head>
<body>
<header><div class="brand">▦ <strong>DeviceDeck</strong><span class="badge" data-i18n="local">本机私有</span></div><button id="language">English</button></header>
<main>
<section class="intro"><div><p class="eyebrow" data-i18n="eyebrow">你的设备，一处掌握</p><h1 data-i18n="title">每台设备，每种连接。</h1><p data-i18n="subtitle">统一查看地址、登录方式与状态。局域网、远程和 USB 入口归属于同一台设备。</p></div><div class="actions"><button id="new-credential" data-i18n="authAdd">登记登录方式</button><button id="new-device" class="primary" data-i18n="deviceAdd">添加设备</button></div></section>
<section class="toolbar"><label><span class="sr-only" data-i18n="search">搜索设备</span><input id="search" type="search" placeholder="搜索设备、地址或类型"></label><span id="count"></span><button id="reload" data-i18n="reload">刷新清单</button></section>
<p id="notice" role="status" aria-live="polite"></p>
<section id="devices" class="grid" aria-label="Devices"></section>
<section class="bottom"><h2 data-i18n="authTitle">登录方式</h2><p data-i18n="authHelp">这里只登记认证类型与凭据位置；密码、私钥和配对码由现有工具保管。</p><div id="credentials"></div><h2 data-i18n="eventsTitle">最近活动</h2><div id="events"></div></section>
</main>
<dialog id="device-dialog"><form id="device-form"><div class="dialog-head"><h2 data-i18n="deviceEdit">登记设备</h2><button type="button" class="close" aria-label="Close">×</button></div><div class="form-grid">
<label><span data-i18n="deviceId">设备 ID</span><input name="id" required pattern="[a-z][a-z0-9_-]{0,63}" placeholder="workstation"></label>
<label><span data-i18n="deviceName">显示名称</span><input name="name" required maxlength="100"></label>
<label><span data-i18n="deviceKind">设备类型</span><select name="kind"><option value="computer">Computer</option><option value="nas">NAS</option><option value="router">Router</option><option value="server">Server</option><option value="android">Android</option><option value="ios">iPhone / iPad</option></select></label>
<label><span data-i18n="hostname">预期机器名（SSH 身份检查）</span><input name="expected_hostname" maxlength="200"></label></div><h3 data-i18n="endpoints">连接入口</h3><div id="endpoint-forms"></div><button id="add-endpoint" type="button" data-i18n="endpointAdd">＋ 添加另一种连接</button><p id="device-error" role="alert"></p><div class="dialog-footer"><button type="submit" class="primary" data-i18n="save">保存</button></div></form></dialog>
<dialog id="credential-dialog"><form id="credential-form"><div class="dialog-head"><h2 data-i18n="authAdd">登记登录方式</h2><button type="button" class="close" aria-label="Close">×</button></div><div class="form-grid">
<label><span data-i18n="profileId">登录配置 ID</span><input name="id" required pattern="[a-z][a-z0-9_-]{0,63}" placeholder="workstation-key"></label><label><span data-i18n="profileName">显示名称</span><input name="name" required maxlength="100"></label>
<label><span data-i18n="method">认证类型</span><select name="method"><option value="ssh_key">SSH key</option><option value="ssh_agent">SSH agent</option><option value="password">Password · manual login</option><option value="adb_pairing">ADB pairing</option><option value="ios_trust">iOS trusted computer</option><option value="wda_access">Existing WDA access</option></select></label>
<label><span data-i18n="keyPath">私钥文件路径（仅 SSH key）</span><input name="key_path" placeholder="~/.ssh/id_ed25519"></label><label class="full"><span data-i18n="vaultRef">外部密码库引用（可选，不填密码）</span><input name="vault_ref" maxlength="200" placeholder="keychain:device-login"></label></div><p data-i18n="authHelp">这里只登记认证类型与凭据位置；密码、私钥和配对码由现有工具保管。</p><p id="credential-error" role="alert"></p><div class="dialog-footer"><button type="submit" class="primary" data-i18n="save">保存</button></div></form></dialog>
<dialog id="plan-dialog"><div class="dialog-head"><h2 data-i18n="connectionHelp">连接说明</h2><button type="button" class="close" aria-label="Close">×</button></div><pre id="plan-command"></pre><ul id="plan-steps"></ul></dialog>
</body></html>
