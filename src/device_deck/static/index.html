<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>DeviceDeck</title>
<link rel="stylesheet" href="/assets/style.css">
<script defer src="/assets/app.js"></script>
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="DeviceDeck">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><circle class="led" cx="7" cy="7" r="0.9"/><circle class="led" cx="7" cy="17" r="0.9"/></svg>
      <span class="brand-name">DeviceDeck</span>
      <span class="version" id="version"></span>
    </div>
    <div class="nav-links">
      <a href="#/devices" data-nav="devices"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg><span data-i18n="navDevices"></span><span class="count" id="nav-devices"></span></a>
      <a href="#/access" data-nav="access"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M21 12v2"/></svg><span data-i18n="navAccess"></span><span class="count" id="nav-access"></span></a>
      <a href="#/activity" data-nav="activity"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span data-i18n="navActivity"></span></a>
    </div>
    <div class="side-foot">
      <div class="local"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span data-i18n="loopback"></span></div>
      <div class="mono data-dir" id="data-dir"></div>
      <button type="button" id="language" class="link-button"></button>
    </div>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<dialog id="credential-dialog" aria-labelledby="credential-title">
  <form id="credential-form" method="dialog" novalidate>
    <div class="dialog-head"><h2 id="credential-title"></h2><button type="button" class="icon-button close" data-i18n-label="close">×</button></div>
    <div class="dialog-body"></div>
    <p class="form-error" role="alert"></p>
    <div class="dialog-foot"><button type="button" class="button close" data-i18n="cancel"></button><button type="submit" class="button primary" data-i18n="save"></button></div>
  </form>
</dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title">
  <div>
    <div class="dialog-head"><h2 id="confirm-title"></h2></div>
    <p class="dialog-body" id="confirm-text"></p>
    <div class="dialog-foot"><button type="button" class="button" id="confirm-cancel" data-i18n="cancel"></button><button type="button" class="button danger" id="confirm-ok"></button></div>
  </div>
</dialog>
</body>
</html>
