name: Tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --locked --extra dev --no-editable --python ${{ matrix.python }}
      - run: uv run --no-editable pytest
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - name: Check web UI script syntax
        run: node --check src/device_deck/static/app.js
      - name: Build wheel and sdist
        run: uv build
      - name: Wheel ships the web UI
        run: python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); missing = [f for f in ('index.html', 'app.js', 'style.css') if 'device_deck/static/' + f not in names]; assert not missing, missing"
